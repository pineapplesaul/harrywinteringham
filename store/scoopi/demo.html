<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>[hidden]{display:none !important}</style>
</head>
<body>
<title>Scoopi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: the dial starts as one centre button. Press it and slide left to fan out the ways to add things, or right to fan out the outputs; tap it to make the file. The form type and what you've added sit in a tray underneath. */
:root{
  --wall-a:#FF6A4D; --wall-b:#F9A83C; --wall-c:#8E5BA8; --wall-d:#E8434F;
  --seg-in:#FFE3CF; --seg-out:#FFF4EA; --seg-hot:#FFFFFF; --seg-ink:#4A2E20; --seg-muted:#8A6A58;
  --rim:rgba(255,255,255,.26); --rim-line:rgba(255,255,255,.55);
  --hub:#FFF5EC;
  --accent:#4346CD; --accent-fg:#FFFFFF;
  --pill:rgba(255,248,242,.8); --pill-ink:#3A2418;
  --ok:#17784A; --bad:#B42318;
  --shadow:0 24px 70px rgba(90,20,10,.35);
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.3,.64,1);
  --font-ui:"DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-data:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --wall-a:#5C1F2A; --wall-b:#7C3B17; --wall-c:#2B1839; --wall-d:#3E1421;
    --seg-in:#3D2423; --seg-out:#2B1E23; --seg-hot:#58393B; --seg-ink:#F7E6D8; --seg-muted:#C9A995;
    --rim:rgba(255,255,255,.07); --rim-line:rgba(255,255,255,.2); --hub:#2F1E21;
    --accent:#9AA8FF; --accent-fg:#14111A;
    --pill:rgba(32,21,23,.8); --pill-ink:#F7E6D8; --ok:#5CC892; --bad:#FF8B80;
    --shadow:0 24px 70px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --wall-a:#5C1F2A; --wall-b:#7C3B17; --wall-c:#2B1839; --wall-d:#3E1421;
  --seg-in:#3D2423; --seg-out:#2B1E23; --seg-hot:#58393B; --seg-ink:#F7E6D8; --seg-muted:#C9A995;
  --rim:rgba(255,255,255,.07); --rim-line:rgba(255,255,255,.2); --hub:#2F1E21;
  --accent:#9AA8FF; --accent-fg:#14111A;
  --pill:rgba(32,21,23,.8); --pill-ink:#F7E6D8; --ok:#5CC892; --bad:#FF8B80;
  --shadow:0 24px 70px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;overscroll-behavior:none}
body{
  margin:0;
  background-color:var(--wall-a);
  background-image:radial-gradient(circle at 18% 18%, var(--wall-b), transparent 55%), radial-gradient(circle at 88% 92%, var(--wall-c), transparent 58%), linear-gradient(140deg, var(--wall-d), var(--wall-a));
  background-attachment:fixed;
  color:var(--seg-ink);
  font:14px/1.4 var(--font-ui);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
.desk{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:40px 110px}

/* The dial. --pl and --pr say how far the left and right halves are open (0 to 1). */
.ring{--pl:0;--pr:0;--pg:0;position:relative;width:min(480px, 100%);aspect-ratio:1;transition:transform .6s var(--spring)}
.ring.awake{transform:scale(1.03)}
#ringSvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.seg,.seg:focus{cursor:pointer;outline:none;transition:transform .55s var(--spring)}
.seg.in{--p:var(--pl);--turn:-16deg}
.seg.out{--p:var(--pr);--turn:16deg}
.ring.open-left .seg.in,.ring.open-right .seg.out{pointer-events:auto}
.bloom{transform-box:fill-box;transform-origin:center;opacity:var(--p);transform:translate(calc(var(--dx) * -5 * (1 - var(--p))), calc(var(--dy) * -5 * (1 - var(--p)))) scale(calc(.5 + .5 * var(--p)));filter:drop-shadow(0 10px 16px rgba(90,20,10,.22));transition:opacity .4s var(--ease), transform .6s var(--spring);transition-delay:calc(var(--j) * 70ms)}
.ring.scrub .bloom{transition:none}
.seg path.shape{fill:var(--seg-out);stroke:var(--seg-out);stroke-width:12;stroke-linejoin:round;transition:fill .35s var(--ease), stroke .35s var(--ease)}
.seg.in path.shape{fill:var(--seg-in);stroke:var(--seg-in)}
.seg:hover path.shape,.seg.hot path.shape{fill:var(--seg-hot);stroke:var(--seg-hot)}
.seg:focus-visible path.shape{stroke:var(--accent)}
.seg .ico{fill:none;stroke:var(--seg-ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center;transition:transform .5s var(--spring)}
.seg text{fill:var(--seg-ink);font:700 11px var(--font-ui);letter-spacing:.1em;text-anchor:middle}
.seg text.small{font:500 11px var(--font-ui);letter-spacing:0;fill:var(--seg-muted)}
.seg.on path.shape{fill:var(--accent);stroke:var(--accent)}
.seg.on .ico{stroke:var(--accent-fg)}
.seg.on text,.seg.on text.small{fill:var(--accent-fg)}
.seg:hover,.seg.hot{transform:translate(var(--dx), var(--dy))}
.seg:hover .ico,.seg.hot .ico{transform:scale(1.16)}
.ring.awake .seg.hot{transform:translate(calc(var(--dx) * 1.8), calc(var(--dy) * 1.8))}
.seg:active{transform:translate(calc(var(--dx) * -.3), calc(var(--dy) * -.3));transition-duration:.12s}
.bloom.pop{animation:pop .6s var(--spring)}
@keyframes pop{35%{transform:scale(1.04)}}

/* The centre button */
.hub{position:absolute;left:50%;top:50%;width:43.5%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--hub);box-shadow:0 18px 50px rgba(90,20,10,.3), inset 0 0 0 1px var(--rim-line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:14px;color:var(--seg-ink);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;outline:none;transition:box-shadow .3s var(--ease)}
.hub:active{cursor:grabbing}
.hub:focus-visible{box-shadow:0 18px 50px rgba(90,20,10,.3), 0 0 0 3px #fff}
.go{width:50%;aspect-ratio:1;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:14px;line-height:1.15;box-shadow:0 8px 20px rgba(67,70,205,.35), inset 0 1px 0 rgba(255,255,255,.25);display:grid;place-items:center;padding:8px;transition:transform .25s var(--spring), filter .2s, box-shadow .3s var(--ease)}
.hub:active .go{transform:scale(.95)}
.go.idle{filter:saturate(.35) opacity(.7)}
.hub .go.ready{animation:swap .45s 50ms var(--ease) backwards, breathe 3.2s 1s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 10px 30px rgba(67,70,205,.5), 0 0 0 8px rgba(67,70,205,.12), inset 0 1px 0 rgba(255,255,255,.25)}}
.hub .sub{font-size:12px;font-weight:500;color:var(--seg-muted);line-height:16px;height:16px;max-width:82%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hub .sub .lnk{font-size:12px}
.hub .sub.low{height:24px;line-height:24px}
.hub .kind{display:inline-flex;align-items:center;gap:5px;height:24px;max-width:84%;padding:0 10px;border-radius:999px;border:1px solid color-mix(in srgb, var(--seg-ink) 22%, transparent);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;cursor:pointer;transition:border-color .2s, background .2s}
.hub .kind span{overflow:hidden;text-overflow:ellipsis}
.hub .kind:hover{border-color:color-mix(in srgb, var(--seg-ink) 50%, transparent);background:color-mix(in srgb, var(--seg-ink) 5%, transparent)}
.hub .kind svg{flex:none;width:9px;height:9px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.6}
.hub .kind.fixed{cursor:default;border-color:transparent;font-weight:500;color:var(--seg-muted)}
.hub .kind.flip{animation:flip .5s var(--ease)}
.hub .msg{font-size:13px;font-weight:600;line-height:1.3;text-wrap:balance}
.chev{position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;fill:none;stroke:var(--seg-muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.7;pointer-events:none}
.chev.l{left:9%;animation:nudgeL 3.4s 2s ease-in-out infinite}
.chev.r{right:9%;animation:nudgeR 3.4s 2s ease-in-out infinite}
@keyframes nudgeL{0%,70%,100%{transform:none}80%{transform:translateX(-4px)}}
@keyframes nudgeR{0%,70%,100%{transform:none}80%{transform:translateX(4px)}}
.ring.open-left .chev,.ring.open-right .chev,.ring.scrub .chev{opacity:0;transition:opacity .2s}
.lnk{border:0;background:none;padding:0;font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.spin{width:30px;height:30px;animation:rot 1s linear infinite}
.spin circle{fill:none;stroke:var(--accent-fg);stroke-width:3;stroke-linecap:round;stroke-dasharray:60 200}
@keyframes rot{to{transform:rotate(360deg)}}
.result{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:grab;touch-action:none;user-select:none;border:0;background:none;padding:0;max-width:100%;animation:pullup .8s var(--spring) backwards}
.result:active{cursor:grabbing}
.hub .result{animation:pullup .8s var(--spring) backwards}
@keyframes pullup{from{transform:translateY(26px) scale(.55) rotate(-6deg);opacity:.15}}
.doc{position:relative;width:42px;height:54px;border-radius:4px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.22);display:grid;place-items:end center;padding-bottom:6px}
.doc::before{content:"";position:absolute;left:8px;right:8px;top:9px;height:16px;background:repeating-linear-gradient(#D7DBE2 0 2px, transparent 2px 5px)}
.doc b{font:600 8.5px var(--font-data);color:#fff;background:#4346CD;padding:1px 4px;border-radius:3px;letter-spacing:.04em}
.result .nm{font-size:12px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copybtn{border:0;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:13px;padding:8px 14px;cursor:pointer}
.bad{color:var(--bad)}
.ok{color:var(--ok)}
.check{width:34px;height:34px}
.check path{fill:none;stroke:var(--ok);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;animation:draw .55s .1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hub > *:not(.chev){animation:swap .45s var(--ease) backwards}
.hub > :nth-child(2){animation-delay:50ms}
.hub > :nth-child(3){animation-delay:100ms}
@keyframes swap{from{transform:translateY(8px);opacity:.15}}
/* The made file sits just right of the centre; if the outputs open it slides out past them. */
.filed{position:absolute;left:calc(71.75% + 20px + 28.25% * var(--pr));top:50%;transform:translateY(-50%);z-index:5;transition:left .55s var(--ease), opacity .3s var(--ease)}
.ring.scrub .filed{transition:opacity .3s var(--ease)}
.filed .result{width:132px;padding:16px 12px 12px;gap:6px;border-radius:18px;background:var(--pill);color:var(--pill-ink);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font:inherit;animation:none;transition:transform .35s var(--spring), opacity .3s var(--ease)}
.filed .result:hover{transform:translateY(-3px) rotate(-1.5deg)}
.filed .result:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.filed .doc{width:48px;height:62px;margin-bottom:4px}
.filed .nm{color:inherit;font-size:12px}
.filed .how{font-size:11px;font-weight:500;opacity:.65;white-space:nowrap}
.filed.out .result{transition:transform .35s var(--ease), opacity .3s var(--ease);transform:translateY(10px) scale(.85);opacity:0}
@media (max-width:620px){
  .filed{left:calc(71.75% + 8px)}
  .ring.open-right .filed,.ring.scrub .filed{opacity:0;pointer-events:none}
  .filed .result{width:94px;padding:10px 8px 9px;border-radius:14px;gap:4px}
  .filed .doc{width:36px;height:47px;margin-bottom:2px}
  .filed .nm{font-size:11px}
  .filed .how{display:none}
}
.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;width:54px;height:70px;border-radius:4px;background:#fff;box-shadow:0 10px 24px rgba(0,0,0,.35);display:grid;place-items:center;font:600 10px var(--font-data);color:#7A7E88}
.ghost.fly{transition:transform .45s var(--ease), opacity .45s var(--ease);opacity:0}

/* Working and finishing */
.orbit{opacity:0;transition:opacity .4s var(--ease)}
.ring.working .orbit{opacity:1;animation:orbit 1.6s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.orbit .track{fill:none;stroke:var(--hub);stroke-opacity:.45;stroke-width:4}
.orbit .arc{fill:none;stroke:var(--hub);stroke-width:4;stroke-linecap:round;stroke-dasharray:110 581}
.wave{fill:none;stroke:var(--hub);stroke-width:3;vector-effect:non-scaling-stroke;opacity:0;animation:wave 1s var(--ease) forwards}
@keyframes wave{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.15)}}
.spark{fill:var(--accent);opacity:0;animation:spark 1s var(--ease) forwards}
.spark.alt{fill:#FFD84D}
.spark.soft{fill:#FFFFFF}
@keyframes spark{0%{transform:translate(0,0) scale(.3);opacity:0}15%{opacity:1}100%{transform:translate(var(--x), var(--y)) scale(1);opacity:0}}

/* The tray */
.tray{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:var(--pill);box-shadow:0 8px 30px rgba(0,0,0,.15);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);max-width:100%;color:var(--pill-ink);animation:rise .7s .45s var(--ease) backwards}
/* With the dial closed the tray tucks up under the centre; as a half opens it moves down under the ring.
   It only moves on screen (--lift is set from the script), so the dial itself never shifts. */
.ring + .tray{transform:translateY(var(--lift, 0px));transition:transform .55s var(--ease)}
.ring.scrub + .tray{transition:none}
@keyframes rise{from{transform:translateY(14px);opacity:.25}}
.formchip{flex:none;border:1px solid color-mix(in srgb, var(--pill-ink) 30%, transparent);background:transparent;border-radius:999px;padding:5px 12px;font:500 12.5px var(--font-ui);cursor:pointer;white-space:nowrap}
.formchip:hover{border-color:var(--pill-ink)}
.formchip:disabled{cursor:default;opacity:.7}
.formchip.flip{animation:flip .5s var(--ease)}
@keyframes flip{from{transform:translateY(-8px) scale(.94);opacity:.2}}
.thumbs{display:flex;gap:6px;overflow-x:auto;min-width:0;padding:2px}
.tin{position:relative;flex:none;width:34px;height:44px}
.tin.new{animation:tinin .6s var(--spring) backwards}
@keyframes tinin{from{transform:translateY(-18px) scale(.6) rotate(-8deg);opacity:.15}}
.tin img,.tin span.ph{width:34px;height:44px;border-radius:3px;object-fit:cover;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);display:grid;place-items:center;font:600 8px var(--font-data);color:#7A7E88}
.tin button{position:absolute;right:-5px;top:-5px;width:16px;height:16px;border-radius:50%;border:0;background:var(--pill-ink);color:var(--pill);font:600 11px/16px var(--font-ui);padding:0;cursor:pointer;opacity:0;transition:opacity .12s}
.tin:hover button,.tin button:focus-visible{opacity:1}
.tray .empty{font-size:12.5px;opacity:.8;white-space:nowrap}
.tray .ex{font-size:12px;font-weight:500;opacity:.65;white-space:nowrap}

/* Hints */
.pill{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:9px 16px;border-radius:999px;background:var(--pill);color:var(--pill-ink);font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.18);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);width:max-content;max-width:calc(100vw - 32px);z-index:4;animation:pillrise .7s .6s var(--ease) backwards}
@keyframes pillrise{from{transform:translate(-50%, 14px);opacity:.25}}
.pill strong{font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.pill span{min-width:0}
.sheet{position:fixed;inset:auto 16px calc(70px + env(safe-area-inset-bottom, 0px)) 16px;margin:0 auto;max-width:520px;padding:14px;border-radius:16px;background:var(--pill);color:var(--pill-ink);box-shadow:0 12px 40px rgba(0,0,0,.25);z-index:5;display:flex;flex-direction:column;gap:8px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.sheet textarea{width:100%;min-height:120px;font:12px var(--font-data);border-radius:8px;border:1px solid var(--seg-muted);background:transparent;padding:8px}
.ring.intro{animation:ringin .9s var(--ease) backwards}
@keyframes ringin{from{transform:scale(.8);filter:blur(10px);opacity:.3}}
@media (max-width:520px){
  .seg text{font-size:9.5px;letter-spacing:.06em}
  .go{font-size:12px}
  .hub{gap:5px;padding:10px}
  .tray{flex-wrap:wrap;justify-content:center}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
</style>

<main class="desk" id="desk">
  <div class="ring intro" id="ring">
    
    <svg id="ringSvg" viewBox="-230 -230 460 460" role="group" aria-label="Scoopi options"></svg>
    <div class="hub" id="hub" role="button" tabindex="0" aria-live="polite"></div>
    <div class="filed" id="filed" hidden></div>
  </div>
  <div class="tray" id="tray"></div>
</main>
<div class="pill" id="pill"><strong>Scoopi</strong><span id="pillText"></span></div>
<div class="sheet" id="copySheet" hidden><strong>Copy this into your sheet</strong><span>It's selected. Press Cmd-C or Ctrl-C, click into your sheet, then paste.</span><textarea id="copyBox" readonly aria-label="Table to copy"></textarea><button class="lnk" type="button" id="copyClose">Done</button></div>

<input type="file" id="filePick" multiple accept="image/*,application/pdf,.pdf,.txt,.csv,.xlsx,.xls,.heic" hidden>

<script>
// Website demo: stands in for Claude so the dial works on the website without an account.
// It "reads" the four example receipts only, and hands back what's printed on them; the files it makes are real.
(() => {
  const RECEIPTS = {
    "receipt-1.png": { date: "22/02/2026", merchant: "BP Bordesley", category: "Fuel", total: "11.30" },
    "receipt-2.png": { date: "24/02/2026", merchant: "Casa Cafe Loughborough", category: "Meals", total: "18.70" },
    "receipt-3.png": { date: "24/02/2026", merchant: "Charnwood Council Parking", category: "Parking", total: "14.00" },
    "receipt-4.png": { date: "26/02/2026", merchant: "Welcome Break Telford", category: "Meals", total: "52.47" },
  };
  const wait = (ms, signal) => new Promise((resolve, reject) => {
    const t = setTimeout(resolve, ms);
    signal?.addEventListener("abort", () => { clearTimeout(t); reject(Object.assign(new Error("Stopped."), { code: "cancelled" })); });
  });
  const sample = {
    limits: async () => ({ images: { maxCount: 20 } }),
    async json(prompt, opts = {}) {
      if (/someone's own/.test(prompt)) throw new Error("The demo fills Scoopi's own forms. Your templates work in the app.");
      const docs = [...prompt.matchAll(/^\[(\d+)\] (.+?)(?: —|$)/gm)].map(m => ({ n: Number(m[1]), name: m[2].trim() }));
      if (!docs.length || docs.some(d => !RECEIPTS[d.name])) throw new Error("The demo reads the example receipts only. Get the app to read your own.");
      await wait(2200, opts.signal);
      const found = docs.map(d => ({ ...RECEIPTS[d.name], doc: d.n }));
      const today = new Date(), fmt = d => d.toLocaleDateString("en-GB");
      if (/called "Invoice"/.test(prompt)) {
        return { fields: { issue_date: fmt(today), due_date: fmt(new Date(today.getTime() + 30 * 864e5)), project: "Expenses, Feb 2026" },
          rows: found.map(r => ({ date: r.date, description: `${r.category}, ${r.merchant}`, qty: 1, unit: r.total, doc: r.doc })) };
      }
      if (/called "Supplier details"/.test(prompt)) {
        const r = found[found.length - 1];
        return { fields: { company: r.merchant, trading: r.merchant }, rows: [] };
      }
      return { fields: { period: "22–26 Feb 2026" },
        rows: found.map(r => ({ date: r.date, merchant: r.merchant, category: r.category, total: r.total, paid: "Card", doc: r.doc })) };
    },
  };
  // Saving downloads the real file the demo made.
  const downloads = {
    async save({ filename, data }) {
      const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data]));
      const a = Object.assign(document.createElement("a"), { href: url, download: filename });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    },
  };
  window.claude = { use: async name => (name === "sample" ? sample : name === "downloads" ? downloads : null) };
})();
</script>
<script>
(() => {
"use strict";

/* ---------- building the spreadsheet ---------- */
function buildAOA(t, rec) {
  const cols = t.columns, aoa = [], fmt = [];
  const pushTable = off => {
    const head = aoa.length;
    aoa.push([...(off ? t.fields.map(f => f.label) : []), ...cols.map(c => c.label)]);
    const fv = t.fields.map(f => rec.fields[f.key] || "");
    rec.rows.forEach(row => {
      const r = aoa.length;
      aoa.push([...(off ? fv : []), ...cols.map((c, ci) => {
        const cell = { r, c: off + ci };
        if (c.type === "money") cell.z = MONEY_FMT;
        if (c.product && computed(c, row) != null) {
          const [a, b] = c.product.map(k => colName(off + cols.findIndex(x => x.key === k)));
          cell.f = `${a}${r + 1}*${b}${r + 1}`;
        }
        if (cell.z || cell.f) fmt.push(cell);
        return cellValue(c, row);
      })]);
    });
    if (!rec.rows.length) { if (off) aoa.push(fv); return; }
    const r = aoa.length, line = new Array(off + cols.length).fill("");
    line[0] = "Total";
    cols.forEach((c, ci) => {
      if (c.type !== "money") return;
      const vals = rec.rows.map(row => num(cellValue(c, row))).filter(n => n != null);
      if (!vals.length) return;
      const L = colName(off + ci);
      line[off + ci] = round2(vals.reduce((a, b) => a + b, 0));
      fmt.push({ r, c: off + ci, z: MONEY_FMT, f: `SUM(${L}${head + 2}:${L}${r})` });
    });
    aoa.push(line);
  };
  if (t.layout === "table" && cols.length) pushTable(t.fields.length);
  else {
    aoa.push([t.name]); aoa.push([]);
    t.fields.forEach(f => aoa.push([f.label, rec.fields[f.key] || ""]));
    if (cols.length) { aoa.push([]); pushTable(0); }
  }
  return { aoa, fmt };
}
function sheetFile(t, rec, kind) {
  if (!window.XLSX) throw new Error("The spreadsheet part didn't load. Reload the page.");
  const { aoa, fmt } = buildAOA(t, rec);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  for (const { r, c, z, f } of fmt) { const cell = ws[XLSX.utils.encode_cell({ r, c })]; if (!cell) continue; if (z) cell.z = z; if (f) cell.f = f; }
  const width = [];
  aoa.forEach(row => row.forEach((v, i) => { const l = typeof v === "number" ? 12 : String(v ?? "").length + 2; width[i] = Math.min(48, Math.max(width[i] || 10, l)); }));
  ws["!cols"] = width.map(w => ({ wch: w || 10 }));
  const base = `${t.name} ${isoToday()}`;
  if (kind === "csv") return { name: base + ".csv", blob: new Blob([XLSX.utils.sheet_to_csv(ws, { rawNumbers: true })], { type: "text/csv" }) };
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, t.name.slice(0, 31));
  return { name: base + ".xlsx", blob: new Blob([XLSX.write(wb, { bookType: "xlsx", type: "array" })]) };
}
function summaryOf(t, rec) {
  if (t.columns.length && rec.rows.length) {
    const mc = [...t.columns].reverse().find(c => c.type === "money");
    const vals = mc ? rec.rows.map(r => num(cellValue(mc, r))).filter(x => x != null) : [];
    return `${rec.rows.length} row${rec.rows.length > 1 ? "s" : ""}${vals.length ? " · " + money(round2(vals.reduce((a, b) => a + b, 0))) : ""}`;
  }
  return `${t.fields.filter(f => rec.fields[f.key]).length} of ${t.fields.length} fields`;
}

/* ---------- filling your own form straight from the documents ---------- */
async function fillSheet(sample, file, docs, images, signal) {
  if (!window.XLSX) throw new Error("The spreadsheet part didn't load. Reload the page.");
  const isCsv = extOf(file.name) === "csv";
  const wb = isCsv ? XLSX.read(await file.text(), { type: "string" }) : XLSX.read(await file.arrayBuffer(), { type: "array" });

    const ws = wb.Sheets[name];
    if (!ws || !ws["!ref"]) continue;
    const rg = XLSX.utils.decode_range(ws["!ref"]);
    listing += `\nSheet "${name}" (used range ${ws["!ref"]}):\n`;
    for (let r = rg.s.r; r <= Math.min(rg.e.r, rg.s.r + 160); r++) for (let c = rg.s.c; c <= Math.min(rg.e.c, 30); c++) {
      const a = XLSX.utils.encode_cell({ r, c }), cell = ws[a];
      if (!cell || cell.v == null || cell.v === "") continue;
      listing += `${a}: ${JSON.stringify(String(cell.w ?? cell.v).replace(/\s+/g, " ").slice(0, 80))}\n`;
      if (++count > 700) break outer;
    }
    const merges = (ws["!merges"] || []).slice(0, 60).map(m => XLSX.utils.encode_range(m));
    if (merges.length) listing += `Merged cells: ${merges.join(", ")}\n`;
  }
  const first = wb.SheetNames[0];
  const prompt = `Fill in someone's own ${isCsv ? "CSV file" : "spreadsheet form"} using the documents they've given you.

THE DOCUMENTS
${docsSection(docs)}
THEIR FILE: ${file.name}
Only cells that already contain something are listed. Every other cell is empty.
${listing || "(the file is empty)"}

HOW TO FILL IT
- Use only what the documents show. Don't guess.
- Put each value in the empty cell that belongs to its label: usually the cell to the right of the label, or the cell below it when the label is a column heading.
- For a table, write one row per item under the matching column headings, starting at the first empty row.${isCsv ? " In a CSV, add new rows under the last row." : ""}
- Only write to empty cells. Never change a cell listed above.
- Numbers as plain numbers (18.7, not "£18.70"). Dates as DD/MM/YYYY. Keep codes such as sort codes and account numbers as text.

Reply with only JSON: {"fills":[{"sheet":"${first}","cell":"B4","value":"text or number"}]}`;
  const opts = { signal };
  if (images.length) opts.images = images;
  const res = await sample.json(prompt, opts);
  let n = 0;
  for (const f of Array.isArray(res?.fills) ? res.fills : []) {
    const sheet = wb.Sheets[f?.sheet] ? f.sheet : first, ws = wb.Sheets[sheet];
    const a = String(f?.cell || "").toUpperCase().trim();
    if (!ws || !/^[A-Z]{1,3}[1-9][0-9]{0,6}$/.test(a)) continue;
    const ex = ws[a];
    if (ex && ex.v != null && ex.v !== "") continue;
    const v = f.value;
    if (v == null || v === "") continue;
    ws[a] = typeof v === "number" ? { t: "n", v } : { t: "s", v: String(v) };
    const rg = XLSX.utils.decode_range(ws["!ref"] || "A1"), cc = XLSX.utils.decode_cell(a);
    rg.s.r = Math.min(rg.s.r, cc.r); rg.s.c = Math.min(rg.s.c, cc.c); rg.e.r = Math.max(rg.e.r, cc.r); rg.e.c = Math.max(rg.e.c, cc.c);
    ws["!ref"] = XLSX.utils.encode_range(rg);
    n++;
  }
  if (!n) throw new Error(`Claude couldn't find where things go in ${file.name}.`);
  const name = baseOf(file.name) + " - filled" + (isCsv ? ".csv" : ".xlsx");
  const blob = isCsv ? new Blob([XLSX.utils.sheet_to_csv(wb.Sheets[first])], { type: "text/csv" }) : new Blob([XLSX.write(wb, { bookType: "xlsx", type: "array" })]);

}
function winAnsi(v) {

    return base.length === 1 && base.charCodeAt(0) < 127 ? base : "?";

    const page = await doc.getPage(p);
    let anns = [];

          type: a.fieldType === "Tx" ? "text" : a.fieldType === "Ch" ? "choice" : a.checkBox ? "checkbox" : a.radioButton ? "radio" : "text",
          options: Array.isArray(a.options) ? a.options.map(o => String(o.displayValue ?? o.exportValue)) : [] };

THE DOCUMENTS
${docsSection(docs)}
FILLABLE BOXES
${fields.slice(0, 250).map(f => `${f.n}. page ${f.page}, ${f.type}${f.options.length ? " (options: " + f.options.join(" | ") + ")" : ""}, internal name ${JSON.stringify(f.name)}`).join("\n")}

PRINTED TEXT OF THE FORM
"""
${text}
"""

Use only what the documents show. Match each value to the box it belongs in, using the labels printed next to the boxes. Checkboxes take true or false. Choice and radio boxes take exactly one of their listed options. Leave out boxes you have nothing for. Dates as DD/MM/YYYY.

});
window.addEventListener("dragleave", e => { if (!hasType(e, "Files")) return; depth = Math.max(0, depth - 1); if (!depth) endDrag(openBefore); });
window.addEventListener("dragover", e => {
  if (!hasType(e, "Files")) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "copy";
  const i = segHit(e.clientX, e.clientY);
  setHot(i); if (view !== "working") dragHub(i);
});
function endDrag(side) { depth = 0; dropTip = ""; setHot(-1); ring.classList.remove("awake"); setOpen(side); refreshHub(); }
window.addEventListener("drop", e => {
  if (!hasType(e, "Files")) return;
  e.preventDefault();
  const i = segHit(e.clientX, e.clientY);
  const list = [...e.dataTransfer.files];
  endDrag("none");
  if (!list.length) return;
  if (view === "working") { say("Still working. Drop them again when it's done."); return; }
  if (i >= 0 && segList[i].key === "template") { setTemplate(list[0]); return; }
  const n = addInputs(list);
  if (n) say(`Added ${n}. Tap the centre to make the file.`);
});

/* ---------- paste screen grabs ---------- */
document.addEventListener("paste", e => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (view === "working") return;
  const imgs = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith("image/") || f.type === "application/pdf");
  if (imgs.length) {
    e.preventDefault();
    const stamp = new Date().toTimeString().slice(0, 8).replace(/:/g, ".");
    addInputs(imgs.map((f, i) => new File([f], f.type.startsWith("image/") ? `Screen grab ${stamp}${imgs.length > 1 ? "-" + (i + 1) : ""}.png` : (f.name || "Pasted.pdf"), { type: f.type })));
    say(`Screen grab added (${inputs.length} in). Grab another, or tap the centre to make the file.`);
    return;
  }
  const text = e.clipboardData?.getData("text/plain");
  if (text && text.trim()) { e.preventDefault(); addInputs([new File([text], "Pasted text.txt", { type: "text/plain" })]); say("Text added. Tap the centre to make the file."); }
});

/* ---------- hints ---------- */
const DEFAULT_HINT = "Slide the centre left to add things, right to pick a file type. Tap the name to change what it makes, tap the button to make it.";
let sayTimer = null;
function say(text, ms = 7000) {
  $("#pillText").textContent = text;
  clearTimeout(sayTimer);
  sayTimer = setTimeout(() => { $("#pillText").textContent = DEFAULT_HINT; }, ms);
}
$("#filePick").addEventListener("change", e => { const fs = [...e.target.files]; e.target.value = ""; if (fs.length) { const n = addInputs(fs); if (n) say(`Added ${n}. Tap the centre to make the file.`); } });
$("#photoPick").addEventListener("change", e => { const fs = [...e.target.files]; e.target.value = ""; if (fs.length) { addInputs(fs); say("Photo added. Tap the centre to make the file."); } });
$("#tplPick").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) setTemplate(f); });

/* ---------- start ---------- */
seedExample();
drawRing();
renderTray();
hubRest();
$("#pillText").textContent = DEFAULT_HINT;
setTimeout(() => ring.classList.remove("intro"), 1000);
// A one-off peek so the halves show they're there, then they fold away again.
if (!calm()) {
  setTimeout(() => { if (openSide === "none" && !gest) setProgress(0.3, 0.3); }, 1100);
  setTimeout(() => { if (openSide === "none" && !gest) setProgress(0, 0); }, 1900);
}
if (document.fonts?.ready) document.fonts.ready.then(() => {
  inputs.forEach((f, i) => { if (f.example) { f.thumb = drawReceipt(EXAMPLE[i], i + 1); f.blob = dataUrlBlob(f.thumb); } });
  renderTray();
});
})();
</script>
