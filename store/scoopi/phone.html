<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scan for Scoopi</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <style>
    .panel { margin-top: 40px; }
    .take { width: 100%; min-height: 64px; font-size: 18px; }
    .pick { display: block; margin: 16px auto 0; }
    .sent { list-style: none; padding: 0; margin: 28px 0 0; }
    .sent li { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
    .sent .ok { color: var(--ink-muted); }
    .sent .bad { color: var(--coral); }
    input[type=file] { display: none; }
    /* The camera fills the screen, with its controls over the bottom, like the phone's own camera. */
    .cam { position: fixed; inset: 0; z-index: 50; background: #000; }
    .cam[hidden] { display: none; }
    .cam video { display: block; width: 100%; height: 100%; object-fit: cover; }
    .cam .bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: space-between;
      padding: 22px 26px calc(22px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0, 0, 0, .6)); }
    .cam .count { width: 80px; font-size: 15px; color: #fff; }
    .cam .done { width: 80px; text-align: right; color: #fff; font-size: 17px; }
    .shutter { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; background: #fff; box-shadow: inset 0 0 0 4px #000; cursor: pointer; transition: transform .1s; }
    .shutter:active { transform: scale(.9); }
  </style>
</head>
<body class="acct">
  <main class="wrap">
    <div class="panel" id="panel" aria-live="polite"></div>
  </main>
  <script>
  // Opened from the QR code in Scoopi: each photo taken here goes to the Mac's tray. The link (after #) says whose.
  (() => {
    const cfg = window.SCOOPI, token = location.hash.slice(1), panel = document.getElementById("panel");
    const el = (tag, attrs = {}, ...kids) => {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
      for (const kid of kids) if (kid != null) n.append(kid);
      return n;
    };
    if (!/^[\w-]+\.[0-9a-f]{32}\.\d+\.[0-9a-f]+$/.test(token)) {
      panel.replaceChildren(el("h1", {}, "Scan for Scoopi"), el("p", {}, "Open this page by scanning the code in Scoopi on your Mac: Photo, then Scan with your phone."));
      return;
    }
    const camera = el("input", { type: "file", accept: "image/*", capture: "environment" });
    const library = el("input", { type: "file", accept: "image/*", multiple: "" });
    const take = el("button", { class: "btn btn-primary take", type: "button" }, "Open camera");
    const pick = el("button", { class: "linkish pick", type: "button" }, "Or choose from your photos");
    const sent = el("ul", { class: "sent" });
    // A camera in the page stays open, so you can take one photo after another; without it, the phone's own camera.
    const video = el("video", { playsinline: "", muted: "", autoplay: "" });
    const shutter = el("button", { class: "shutter", type: "button", "aria-label": "Take a photo" });
    const count = el("span", { class: "count" });
    const done = el("button", { class: "linkish done", type: "button" }, "Done");
    const cam = el("div", { class: "cam", hidden: "" }, video, el("div", { class: "bar" }, count, shutter, done));
    let stream = null, shots = 0;
    take.addEventListener("click", async () => {
      if (!navigator.mediaDevices?.getUserMedia) { camera.click(); return; }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 3840 }, height: { ideal: 2160 } } });
        video.muted = true; video.srcObject = stream; await video.play();
        take.hidden = pick.hidden = true; cam.hidden = false;
        document.body.style.overflow = "hidden";
      } catch { camera.click(); }
    });
    shutter.addEventListener("click", () => {
      const w = video.videoWidth, h = video.videoHeight;
      if (!w) return;
      const s = Math.min(1, 2200 / Math.max(w, h)), c = el("canvas");
      c.width = Math.round(w * s); c.height = Math.round(h * s);
      c.getContext("2d").drawImage(video, 0, 0, c.width, c.height);
      video.animate([{ opacity: 0.15 }, { opacity: 1 }], { duration: 260 });
      count.textContent = ++shots + (shots === 1 ? " photo" : " photos");
      c.toBlob((b) => b && send(b, true), "image/jpeg", 0.85);
    });
    done.addEventListener("click", () => {
      stream?.getTracks().forEach((t) => t.stop()); stream = null;
      cam.hidden = true; take.hidden = pick.hidden = false;
      document.body.style.overflow = "";
    });
    pick.addEventListener("click", () => library.click());
    let n = 0;
    for (const input of [camera, library]) input.addEventListener("change", async () => {
      const files = [...input.files]; input.value = "";
      for (const f of files) await send(f);
    });
    panel.replaceChildren(
      el("h1", {}, "Scan for Scoopi"),
      el("p", {}, "Take a photo of each receipt, flat and in good light, one after another. Each one appears in Scoopi on your Mac in a few seconds."),
      take, pick, cam, camera, library, sent);

    // Photos are shrunk to 2,200 pixels on the long side (plenty to read) before they're sent.
    function shrink(file) {
      return new Promise((resolve, reject) => {
        const img = new Image(), url = URL.createObjectURL(file);
        img.onload = () => {
          const s = Math.min(1, 2200 / Math.max(img.naturalWidth, img.naturalHeight));
          const c = el("canvas"); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          c.toBlob((b) => b ? resolve(b) : reject(new Error("Couldn't read that photo")), "image/jpeg", 0.85);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Couldn't read that photo")); };
        img.src = url;
      });
    }

    async function send(file, ready = false) {
      const label = "Photo " + (++n), row = el("li", {}, el("span", {}, label), el("span", { class: "ok" }, "Sending…"));
      sent.prepend(row);
      const state = row.lastChild;
      try {
        const res = await fetch(cfg.supabaseUrl + "/functions/v1/phone?action=upload&token=" + encodeURIComponent(token), {
          method: "POST", headers: { apikey: cfg.anonKey, "content-type": "image/jpeg" }, body: ready ? file : await shrink(file),
        });
        if (!res.ok) throw new Error((await res.json().catch(() => null))?.error?.message || "Couldn't send it. Try again.");
        state.textContent = "✓ Sent to Scoopi";
      } catch (e) {
        state.className = "bad"; state.textContent = e.message;
      }
    }
  })();
  </script>
</body>
</html>
