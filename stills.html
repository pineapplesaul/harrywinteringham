<script>
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
</script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0f0f0f;
    --white: #fafaf8;
    --mid: #888;
    --rule: #d0cfc9;
    --text-secondary: #444;
    --serif: 'EB Garamond', Georgia, serif;
    --sans: 'Karla', sans-serif;
  }

  [data-theme="dark"] {
    --black: #e8e6e1;
    --white: #141414;
    --mid: #777;
    --rule: #2a2a2a;
    --text-secondary: #aaa;
  }

  html { font-size: 16px; }
  body {
    background: var(--white);
    color: var(--black);
    font-family: var(--sans);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    transition: background 0.4s ease, color 0.4s ease;
  }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 22px 40px;
    background: var(--white);
    transition: box-shadow 0.3s, background 0.4s ease;
  }
  nav.scrolled { box-shadow: 0 12px 32px rgba(0,0,0,0.06); }
  .nav-logo {
    font-family: var(--sans);
    font-weight: 300;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--black);
    line-height: 1.3;
  }
  .nav-links {
    display: flex;
    gap: 36px;
    list-style: none;
  }
  .nav-links a {
    font-family: var(--sans);
    font-weight: 300;
    font-size: 0.82rem;
    letter-spacing: 0.03em;
    text-decoration: none;
    color: var(--black);
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--mid); }
  .nav-links a.active { color: var(--mid); }

  /* ── DARK MODE TOGGLE ── */
  .theme-toggle {
    background: none;
    border: none;
    width: 32px;
    height: 32px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s;
    flex-shrink: 0;
  }
  .theme-toggle:hover { opacity: 0.5; }
  .theme-toggle svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: var(--black);
    stroke-width: 1.5;
    transition: stroke 0.3s;
  }
  .theme-toggle .icon-moon { display: block; }
  .theme-toggle .icon-sun { display: none; }
  [data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: block; }

  /* ── COPY EMAIL ── */
  .copy-email {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--sans);
    font-size: 0.82rem;
    font-weight: 300;
    letter-spacing: 0.02em;
    color: var(--black);
    background: none;
    border: none;
    padding: 6px 0;
    cursor: pointer;
    transition: color 0.2s;
    position: relative;
  }
  .copy-email:hover { color: var(--mid); }
  .copy-email svg {
    width: 14px;
    height: 14px;
    stroke: var(--mid);
    fill: none;
    stroke-width: 1.5;
    flex-shrink: 0;
  }
  .copy-email .copied-msg {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--mid);
    opacity: 0;
    transition: opacity 0.3s;
    white-space: nowrap;
  }
  .copy-email .copied-msg.show { opacity: 1; }
  [data-theme="dark"] footer a { color: var(--black); }
  [data-theme="dark"] .smiley-icon { filter: grayscale(1) invert(1); }

  /* ── PAGE HEADER ── */
  .page-header {
    padding: 140px 40px 24px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .page-header h1 {
    font-family: var(--serif);
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 400;
    line-height: 1.15;
  }
  .page-header span {
    font-size: 0.75rem;
    color: var(--mid);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* ── STILLS GRID ── */
  .stills-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    padding: 0 40px 80px;
  }
  .still-item {
    position: relative;
    overflow: hidden;
  }
  .still-item img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    transition: transform 0.6s ease, filter 0.4s ease;
    filter: grayscale(20%);
  }
  .still-item:hover img { transform: scale(1.04); filter: grayscale(0%); }

  /* ── FOOTER ── */
  footer {
    padding: 56px 40px 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  footer p {
    font-size: 0.75rem;
    color: var(--mid);
    letter-spacing: 0.03em;
  }

  /* ── SCROLL REVEAL ── */
  .reveal {
    opacity: 0;
    transform: translateY(32px);
    transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .still-item.reveal { transition-delay: calc(var(--i, 0) * 80ms); }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    nav { padding: 18px 20px; }
    .nav-links { gap: 20px; }
    nav .copy-email { display: none; }
    .page-header { padding: 110px 20px 20px; }
    .stills-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 20px 56px; }
    footer { flex-direction: column; gap: 12px; padding: 32px 20px; text-align: center; }
  }
</style>
</head>

<script>
  // Scroll-triggered nav border
  const nav = document.getElementById('main-nav');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 60);
  }, { passive: true });

  // Scroll reveal
  document.querySelectorAll('.still-item').forEach((el, i) => {
    el.classList.add('reveal');
    el.style.setProperty('--i', i % 3);
  });
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

  // Copy email to clipboard
  function copyEmail(btn) {
    const email = btn.getAttribute('data-email');
    navigator.clipboard.writeText(email).then(() => {
      const msg = btn.querySelector('.copied-msg');
      msg.classList.add('show');
      setTimeout(() => msg.classList.remove('show'), 1500);
    });
  }

  // Dark mode toggle
  const toggle = document.querySelector('.theme-toggle');
  toggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });
</script>
